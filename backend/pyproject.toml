[project]
name = "daymark-backend"
version = "1.0.0"
description = "FastAPI backend for the Daymark personal task manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "google-api-python-client>=2.140,<3",
    "google-auth>=2.34,<3",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
